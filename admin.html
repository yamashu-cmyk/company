<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>LIFE QUEST OS — 管理者ダッシュボード</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#050505;color:#fff;font-family:'Helvetica Neue',Arial,sans-serif;min-height:100dvh}
    :root{--mind:#9b59b6;--skill:#3498db;--knowhow:#e74c3c;--cyber:'Orbitron','Courier New',monospace}

    .header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #111;position:sticky;top:0;background:#050505;z-index:10;flex-wrap:wrap;gap:8px}
    .header-left{display:flex;align-items:center;gap:10px}
    .header-title{font-family:var(--cyber);font-size:11px;letter-spacing:3px;color:#555}
    .btn{background:#0d0d0d;border:1px solid #222;border-radius:8px;color:#888;font-size:12px;padding:7px 12px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
    .btn:hover{background:#1a1a1a;color:#fff;border-color:#444}
    .back-link{font-size:11px;color:#333;text-decoration:none;letter-spacing:1px}.back-link:hover{color:#fff}

    /* ALERT BAR */
    .alert-bar{background:#1a0a0a;border-bottom:1px solid #e74c3c44;padding:8px 16px;display:flex;align-items:center;gap:8px}
    .alert-bar.hidden{display:none}
    .alert-label{font-size:9px;letter-spacing:3px;color:#e74c3c;font-family:var(--cyber);flex-shrink:0}
    .alert-names{font-size:12px;color:#ff6b6b;flex:1}

    /* STATS BAR */
    .stats-bar{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid #0a0a0a;overflow-x:auto;scrollbar-width:none}
    .stats-bar::-webkit-scrollbar{display:none}
    .stat-chip{background:#0d0d0d;border:1px solid #1a1a1a;border-radius:8px;padding:8px 14px;text-align:center;flex-shrink:0}
    .stat-chip-num{font-size:20px;font-weight:bold;font-family:var(--cyber)}
    .stat-chip-label{font-size:9px;color:#444;letter-spacing:2px;margin-top:2px}
    .stat-chip.danger .stat-chip-num{color:#e74c3c}
    .stat-chip.danger .stat-chip-label{color:#e74c3c88}

    /* GRID */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:16px}

    /* CARD */
    .card{background:#0d0d0d;border:1px solid #1a1a1a;border-radius:12px;padding:16px;transition:border-color .2s}
    .card:hover{border-color:#2a2a2a}
    .card.skipped{border-color:#e74c3c44;background:#110808}
    .card-rank{font-size:9px;color:#333;letter-spacing:2px;margin-bottom:4px;font-family:var(--cyber)}
    .card-name{font-size:18px;font-weight:bold;color:#fff;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .badge{font-size:9px;border-radius:4px;padding:1px 6px;border:1px solid;white-space:nowrap}
    .badge-local{color:#3a8;border-color:#3a8;background:#0a1a0a}
    .badge-active{color:#4c4;border-color:#4c4;background:#0a2a0a}
    .badge-skipped{color:#e74c3c;border-color:#e74c3c;background:#1a0808}
    .badge-today{color:#ffcc00;border-color:#ffcc00;background:#1a1400}
    .card-lv{font-size:28px;font-weight:bold;font-family:var(--cyber);color:#fff;margin-bottom:2px}
    .card-lv-label{font-size:9px;color:#444;letter-spacing:2px;margin-bottom:10px}
    .progress-bar{height:4px;background:#111;border-radius:2px;margin-bottom:4px;overflow:hidden}
    .progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#3498db,#9b59b6)}
    .progress-pct{font-size:9px;color:#444;text-align:right;margin-bottom:10px}
    .stat-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
    .stat-badge{font-size:10px;padding:3px 8px;border-radius:6px;border:1px solid;font-family:var(--cyber);font-weight:bold}
    .stat-badge.mind{color:var(--mind);border-color:#9b59b633}
    .stat-badge.skill{color:var(--skill);border-color:#3498db33}
    .stat-badge.knowhow{color:var(--knowhow);border-color:#e74c3c33}
    .meta-row{display:flex;justify-content:space-between;font-size:10px;color:#333;border-top:1px solid #111;padding-top:8px;margin-top:4px;flex-wrap:wrap;gap:4px}
    .card-logs{margin-top:10px;border-top:1px solid #111;padding-top:8px}
    .card-log-title{font-size:9px;color:#333;letter-spacing:2px;margin-bottom:6px}
    .card-log-entry{background:#000;border-radius:4px;padding:6px 8px;margin-bottom:4px;font-size:10px;color:#666;line-height:1.4}
    .card-log-date{font-size:9px;color:#333;margin-bottom:2px;font-family:var(--cyber)}
    .empty{text-align:center;padding:60px 20px;color:#222;font-size:12px;letter-spacing:2px;grid-column:1/-1;line-height:2}
    .badge-meeting{color:#ffcc00;border-color:#ffcc00;background:#1a1400}
    .badge-meeting-done{color:#4c4;border-color:#4c4;background:#0a2a0a}
    /* 介入記録エリア */
    .card-actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid #111;flex-wrap:wrap}
    .action-btn{font-size:10px;padding:4px 10px;border-radius:6px;border:1px solid #222;background:#0a0a0a;color:#555;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
    .action-btn:hover{border-color:#444;color:#fff}
    .action-btn.active-called{border-color:#3498db;color:#3498db;background:#0a101a}
    .action-btn.active-meeting{border-color:#ffcc00;color:#ffcc00;background:#1a1400}
    .action-btn.active-done{border-color:#4c4;color:#4c4;background:#0a1a0a}
    .card-memo{margin-top:6px}
    .memo-input{width:100%;background:#000;border:1px solid #111;border-radius:6px;color:#666;font-size:11px;padding:6px 10px;font-family:inherit;outline:none;transition:border-color .15s}
    .memo-input:focus{border-color:#333;color:#fff}
    .memo-input::placeholder{color:#222}
    .alert-bar2{background:#1a1400;border-bottom:1px solid #ffcc0044;padding:8px 16px;display:flex;align-items:center;gap:8px}
    .alert-bar2.hidden{display:none}
    .alert-label2{font-size:9px;letter-spacing:3px;color:#ffcc00;font-family:var(--cyber);flex-shrink:0}
    .alert-names2{font-size:12px;color:#ffe066;flex:1}
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <a class="back-link" href="index.html">← アプリ</a>
    <span class="header-title">👥 管理者ダッシュボード</span>
  </div>
  <button class="btn" id="refresh-btn">🔄 更新</button>
</div>

<!-- Lv.10面談未実施アラート -->
<div class="alert-bar2 hidden" id="alert-bar2">
  <span class="alert-label2">🏆 面談未実施</span>
  <span class="alert-names2" id="alert-names2"></span>
</div>

<!-- 昨日さぼった人アラート -->
<div class="alert-bar hidden" id="alert-bar">
  <span class="alert-label">⚠ 昨日未提出</span>
  <span class="alert-names" id="alert-names"></span>
</div>

<div class="stats-bar">
  <div class="stat-chip"><div class="stat-chip-num" id="total-users">0</div><div class="stat-chip-label">参加者数</div></div>
  <div class="stat-chip"><div class="stat-chip-num" id="total-reports">0</div><div class="stat-chip-label">総日報数</div></div>
  <div class="stat-chip"><div class="stat-chip-num" id="avg-lv">—</div><div class="stat-chip-label">平均Lv</div></div>
  <div class="stat-chip"><div class="stat-chip-num" id="active-today">0</div><div class="stat-chip-label">本日活動</div></div>
  <div class="stat-chip danger"><div class="stat-chip-num" id="skipped-yesterday">0</div><div class="stat-chip-label">昨日未提出</div></div>
  <div class="stat-chip" style="border-color:#ffcc0033"><div class="stat-chip-num" id="meeting-pending" style="color:#ffcc00">0</div><div class="stat-chip-label" style="color:#ffcc0088">面談待ち</div></div>
</div>

<div class="grid" id="grid">
  <div class="empty">データを読み込んでいます...</div>
</div>

<script>
var STATS=[{key:'MIND',cls:'mind'},{key:'SKILL',cls:'skill'},{key:'KNOWHOW',cls:'knowhow'}];
var MAX_LV_TOTAL=20; // 合計Lv.20 = 100%
var MEETING_TRIGGER_LV=10; // 面談トリガー総レベル

var profiles=[];

// ── 介入記録（adminNotes）──
var adminNotes={};
function loadAdminNotes(){try{adminNotes=JSON.parse(localStorage.getItem('lq_admin_notes')||'{}');}catch(_){adminNotes={};}}
function saveAdminNotes(){localStorage.setItem('lq_admin_notes',JSON.stringify(adminNotes));}
function getNote(name){return adminNotes[name]||(adminNotes[name]={called:false,meeting:false,meetingDone:false,memo:''});}

function todayStr(){return new Date().toISOString().slice(0,10);}
function yesterdayStr(){var d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function totalLv(p){
  if(!p.stats)return 0;
  return Object.values(p.stats).reduce(function(s,st){return s+(st.level||1);},0);
}
function reachedMeetingLv(p){return totalLv(p)>=MEETING_TRIGGER_LV;}
function meetingPending(p){return reachedMeetingLv(p)&&!getNote(p.playerName).meetingDone;}

function loadLocal(){
  try{
    var accountList=JSON.parse(localStorage.getItem('lq_accounts')||'[]');
    accountList.forEach(function(name){
      try{
        var raw=localStorage.getItem('lq_user_'+name);
        if(!raw)return;
        var d=JSON.parse(raw);
        if(!d||!d.playerName)return;
        d._source='local';
        var idx=profiles.findIndex(function(p){return p.playerName===d.playerName;});
        if(idx>=0)profiles[idx]=d;else profiles.push(d);
      }catch(_){}
    });
    // lq_user_* キーをスキャン（漏れ対策）
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(!k||!k.startsWith('lq_user_'))continue;
      try{
        var raw=localStorage.getItem(k);
        if(!raw)continue;
        var d=JSON.parse(raw);
        if(!d||!d.playerName)continue;
        var already=profiles.some(function(p){return p.playerName===d.playerName;});
        if(!already){d._source='local';profiles.push(d);}
      }catch(_){}
    }
    // 旧形式フォールバック
    if(profiles.length===0){
      var raw=localStorage.getItem('lifequest');
      if(raw){var d=JSON.parse(raw);if(d&&d.playerName){d._source='local';profiles.push(d);}}
    }
  }catch(_){}
}

function calcStreak(p){
  if(!p.days)return 0;
  var streak=0;
  var todayHasXp=p.days[todayStr()]&&p.days[todayStr()].xp>0;
  var start=todayHasXp?0:1;
  for(var i=start;;i++){
    var d=new Date();d.setDate(d.getDate()-i);
    var ds=d.toISOString().slice(0,10);
    var day=p.days[ds];
    if(!day){break;}
    if(day.isOff){continue;}
    if(day.xp>0){streak++;}else{break;}
  }
  return streak;
}

function lastDate(p){
  if(!p.days)return '—';
  var dates=Object.keys(p.days).filter(function(ds){var d=p.days[ds];return d&&d.xp>0;});
  return dates.length?dates.sort().pop():'—';
}

function isActiveToday(p){
  var t=todayStr();return p.days&&p.days[t]&&p.days[t].xp>0;
}

function skippedYesterday(p){
  var y=yesterdayStr();
  // 昨日のデータがない、またはXP=0（かつオフ日でない）
  var day=p.days&&p.days[y];
  if(!day)return true; // 昨日のデータ自体なし
  if(day.isOff)return false; // オフ日は除外
  return !(day.xp>0);
}

function updateSummary(){
  var skipped=profiles.filter(skippedYesterday);
  var meetPending=profiles.filter(meetingPending);
  document.getElementById('total-users').textContent=profiles.length;
  document.getElementById('total-reports').textContent=profiles.reduce(function(s,p){return s+((p.log&&p.log.length)||0);},0);
  document.getElementById('avg-lv').textContent=profiles.length?Math.round(profiles.reduce(function(s,p){return s+totalLv(p);},0)/profiles.length):'—';
  document.getElementById('active-today').textContent=profiles.filter(isActiveToday).length;
  document.getElementById('skipped-yesterday').textContent=skipped.length;
  document.getElementById('meeting-pending').textContent=meetPending.length;

  // 昨日未提出アラート
  var alertBar=document.getElementById('alert-bar');
  if(skipped.length>0){
    document.getElementById('alert-names').textContent=skipped.map(function(p){return p.playerName;}).join('、')+' が昨日提出していません';
    alertBar.classList.remove('hidden');
  } else {alertBar.classList.add('hidden');}

  // 面談未実施アラート
  var alertBar2=document.getElementById('alert-bar2');
  if(meetPending.length>0){
    document.getElementById('alert-names2').textContent=meetPending.map(function(p){return p.playerName;}).join('、')+' がLv.'+MEETING_TRIGGER_LV+'到達。面談未実施';
    alertBar2.classList.remove('hidden');
  } else {alertBar2.classList.add('hidden');}
}

function render(){
  var grid=document.getElementById('grid');
  if(profiles.length===0){
    grid.innerHTML='<div class="empty">参加者データがありません<br><small style="color:#1a1a1a;font-size:10px">アプリを使用してログインした人のデータが自動で表示されます</small></div>';
    updateSummary();return;
  }
  grid.innerHTML='';
  // さぼった人を先頭に、次にレベル順
  var sorted=profiles.slice().sort(function(a,b){
    var as=skippedYesterday(a)?1:0,bs=skippedYesterday(b)?1:0;
    if(as!==bs)return bs-as; // さぼった人を上に
    return totalLv(b)-totalLv(a);
  });
  sorted.forEach(function(p,i){
    var lv=totalLv(p);
    var pct=Math.min(100,Math.round((lv-STATS.length)/(MAX_LV_TOTAL-STATS.length)*100));
    var streak=calcStreak(p);
    var last=lastDate(p);
    var logCount=(p.log&&p.log.length)||0;
    var isLocal=p._source==='local';
    var activeToday=isActiveToday(p);
    var saboった=skippedYesterday(p);

    var statBadges=STATS.map(function(s){
      var st=p.stats&&p.stats[s.key];
      return '<span class="stat-badge '+s.cls+'">'+s.key+' Lv'+(st?st.level:1)+'</span>';
    }).join('');

    var note=getNote(p.playerName);
    var isMeetPending=meetingPending(p);

    var badges='';
    if(isLocal)badges+='<span class="badge badge-local">本端末</span>';
    if(activeToday)badges+='<span class="badge badge-active">✓ 本日提出</span>';
    if(saboった)badges+='<span class="badge badge-skipped">⚠ 昨日未提出</span>';
    if(isMeetPending)badges+='<span class="badge badge-meeting">🏆 面談未実施</span>';
    if(reachedMeetingLv(p)&&note.meetingDone)badges+='<span class="badge badge-meeting-done">✓ 面談済み</span>';

    var recentLogs=(p.log||[]).filter(function(e){return e.text&&e.text.length>0;}).slice(-2).reverse();
    var logsHtml=recentLogs.length?'<div class="card-logs"><div class="card-log-title">最近の日報</div>'+recentLogs.map(function(e){
      return '<div class="card-log-entry">'+(e.date?'<div class="card-log-date">'+e.date+'</div>':'')+'<div>'+esc(e.text).slice(0,80)+(e.text.length>80?'…':'')+'</div></div>';
    }).join('')+'</div>':'';

    var card=document.createElement('div');
    card.className='card'+(saboった?' skipped':'');
    if(activeToday&&!saboった)card.style.borderColor='#1a3a1a';
    card.innerHTML=
      '<div class="card-rank">#'+(i+1)+'</div>'
      +'<div class="card-name">'+esc(p.playerName)+badges+'</div>'
      +'<div class="card-lv">Lv. '+lv+'</div>'
      +'<div class="card-lv-label">TOTAL LEVEL</div>'
      +'<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>'
      +'<div class="progress-pct">進捗 '+pct+'%（卒業目安 Lv'+MAX_LV_TOTAL+'）</div>'
      +'<div class="stat-row">'+statBadges+'</div>'
      +'<div class="meta-row"><span>🔥 '+streak+'日連続</span><span>📝 '+logCount+'件</span><span>最終: '+last+'</span></div>'
      +logsHtml
      +'<div class="card-actions">'
        +'<button class="action-btn'+(note.called?' active-called':'')+'" data-name="'+esc(p.playerName)+'" data-act="called">'+(note.called?'✓ 声かけ済み':'声かけ')+'</button>'
        +'<button class="action-btn'+(note.meeting?' active-meeting':'')+'" data-name="'+esc(p.playerName)+'" data-act="meeting">'+(note.meeting?'📅 面談設定済み':'面談設定')+'</button>'
        +(reachedMeetingLv(p)?'<button class="action-btn'+(note.meetingDone?' active-done':'')+'" data-name="'+esc(p.playerName)+'" data-act="meetingDone">'+(note.meetingDone?'✓ 面談完了':'面談完了にする')+'</button>':'')
      +'</div>'
      +'<div class="card-memo"><input class="memo-input" data-name="'+esc(p.playerName)+'" placeholder="管理者メモ（例: 5/20に声かけ済み）" value="'+esc(note.memo||'')+'"></div>';
    grid.appendChild(card);
  });
  updateSummary();
}

document.getElementById('refresh-btn').addEventListener('click',function(){
  profiles=[];loadLocal();render();
});

// 介入ボタン操作（イベント委任）
document.getElementById('grid').addEventListener('click',function(e){
  var btn=e.target.closest('.action-btn');
  if(!btn)return;
  var name=btn.getAttribute('data-name');
  var act=btn.getAttribute('data-act');
  var n=getNote(name);
  if(act==='called'){n.called=!n.called;}
  else if(act==='meeting'){n.meeting=!n.meeting;}
  else if(act==='meetingDone'){n.meetingDone=!n.meetingDone;}
  saveAdminNotes();
  render();
});

// メモ保存（フォーカスアウト時）
document.getElementById('grid').addEventListener('blur',function(e){
  var inp=e.target.closest('.memo-input');
  if(!inp)return;
  var name=inp.getAttribute('data-name');
  var n=getNote(name);
  n.memo=inp.value;
  saveAdminNotes();
},true);

// Init
loadAdminNotes();
loadLocal();
render();
</script>
</body>
</html>
